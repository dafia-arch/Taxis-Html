<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Taxi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="Taxi.css">
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">
  <div class="mx-auto max-w-6xl space-y-6">
    
    <!-- Selección de Servicio -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-lg font-bold">Tipo de servicio</h2>
      <select id="tipoServicio" class="w-full md:w-1/3 rounded-lg border border-slate-300 p-3 outline-none focus:border-blue-500">
        <option value="Individual">Individual</option>
        <option value="Masivo">Masivo</option>
      </select>
    </div>

    <!-- Sección Individual -->
    <div id="seccionIndividual" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm block">
      <h2 class="mb-5 text-xl font-bold">Datos del servicio (Individual)</h2>
      <div class="grid gap-4 md:grid-cols-3">
        <label class="block text-sm font-semibold">No. Empleado
          <input type="text" id="ind_emp" class="mt-1 w-full rounded-lg border p-2.5" placeholder="12345">
        </label>
        <label class="block text-sm font-semibold">Código postal
          <input type="text" id="ind_cp" maxlength="5" class="mt-1 w-full rounded-lg border p-2.5" placeholder="25904">
        </label>
        <label class="block text-sm font-semibold">Ciudad
          <input type="text" id="ind_ciudad" class="mt-1 w-full rounded-lg border bg-slate-50 p-2.5" readonly>
        </label>
        <label class="block text-sm font-semibold">Colonia
          <select id="ind_colonia" class="mt-1 w-full rounded-lg border p-2.5"></select>
        </label>
        <label class="block text-sm font-semibold md:col-span-2">Calle
          <input type="text" id="ind_calle" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <label class="block text-sm font-semibold">Número
          <input type="text" id="ind_numero" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
      </div>

      <!-- Mapa Individual -->
      <div id="mapaIndividualContainer" class="mt-6 hidden rounded-xl border border-blue-100 bg-blue-50 p-4">
        <div class="mb-3 flex items-center justify-between">
          <h3 class="font-bold text-blue-800">Vista previa del mapa</h3>
          <a id="linkMapaIndividual" target="_blank" class="rounded-lg bg-blue-600 px-4 py-2 text-sm text-white">Ver ubicación ↗</a>
        </div>
        <iframe id="iframeIndividual" class="h-64 w-full rounded-lg border-0" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>

    <!-- Sección Masivo -->
    <div id="seccionMasivo" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-5 text-xl font-bold">Carga masiva</h2>
      <p class="mb-4 text-sm text-slate-500">Pega los datos desde Excel en la tabla. Selecciona una fila para ver el mapa abajo.</p>
      
      <div class="overflow-x-auto rounded-lg border border-slate-200">
        <table class="w-full text-left text-sm whitespace-nowrap" id="tablaMasiva">
          <thead class="bg-slate-100">
            <tr>
              <th class="p-3">No. Emp</th>
              <th class="p-3">Nombre</th>
              <th class="p-3">CP</th>
              <th class="p-3">Ciudad</th>
              <th class="p-3">Colonia</th>
              <th class="p-3">Calle</th>
              <th class="p-3">Num</th>
            </tr>
          </thead>
          <tbody id="tbodyMasivo" class="divide-y divide-slate-200 bg-white">
            <!-- Filas generadas por JS -->
          </tbody>
        </table>
      </div>

      <!-- Mapa Masivo (Debajo de la tabla) -->
      <div id="mapaMasivoContainer" class="mt-6 hidden rounded-xl border border-blue-100 bg-blue-50 p-4">
        <div class="mb-3 flex items-center justify-between">
          <h3 class="font-bold text-blue-800">Mapa de la fila seleccionada</h3>
          <a id="linkMapaMasivo" target="_blank" class="rounded-lg bg-blue-600 px-4 py-2 text-sm text-white">Ver ubicación ↗</a>
        </div>
        <iframe id="iframeMasivo" class="h-64 w-full rounded-lg border-0" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>

    <div class="flex justify-end">
      <button id="btnEnviar" class="rounded-xl bg-blue-600 px-8 py-3 font-bold text-white shadow hover:bg-blue-700">
        Confirmar solicitud
      </button>
    </div>
  </div>

  <script src="Taxis.js"></script>
</body>
</html>
